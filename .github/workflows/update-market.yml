name: Update market card
on:
  push:
    branches: [main]
jobs:
  update_market:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run market sync
        run: node scripts/sync-market.js
